  <rect x="42" y="75" width="116" height="8" fill="#d4af37"/>
  <!-- 4 Pillars -->
  <rect x="52" y="87" width="14" height="48" rx="2" fill="#ffffff"/>
  <rect x="76" y="87" width="14" height="48" rx="2" fill="#ffffff"/>
  <rect x="110" y="87" width="14" height="48" rx="2" fill="#ffffff"/>
  <rect x="134" y="87" width="14" height="48" rx="2" fill="#ffffff"/>
  <!-- Base Pedestal -->
  <rect x="42" y="138" width="116" height="8" fill="#d4af37"/>
  <rect x="36" y="146" width="128" height="6" fill="#ffffff"/>
</svg>
