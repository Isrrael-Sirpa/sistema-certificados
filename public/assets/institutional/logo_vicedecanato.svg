<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="vicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f44"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <!-- Classical Architectural Pediment / Pillars of University Leadership -->
  <rect x="25" y="25" width="150" height="150" rx="16" fill="url(#vicGrad)" stroke="#d4af37" stroke-width="4"/>
